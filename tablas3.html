<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-Juego de Multiplicar</title>
<style>
  body {
    font-family: 'Comic Sans MS', sans-serif;
    background: linear-gradient(120deg, #fef6e4, #ffe6cc);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .container {
    background: #ffffffcc;
    border-radius: 20px;
    padding: 20px 30px;
    margin-top: 20px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    text-align: center;
  }
  h1 {
    color: #ff6600;
    margin-bottom: 10px;
  }
  #character {
    font-size: 80px;
    margin: 10px 0;
  }
  .tabla-select {
    margin: 10px 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
  }
  .tabla-select label {
    font-size: 16px;
  }
  #tablesDisplay {
    margin-top: 15px;
    display: none;
    max-height: 300px;
    overflow-y: auto;
    padding: 10px;
    border-radius: 10px;
    background: #fff8e0;
  }
  .tabla {
    display: inline-block;
    margin: 10px;
    border-collapse: collapse;
    border: 2px solid #ff6600;
    border-radius: 8px;
    overflow: hidden;
  }
  .tabla th, .tabla td {
    border: 1px solid #ff6600;
    padding: 5px 10px;
    font-size: 16px;
    text-align: center;
    background: #fff2e0;
  }
  .question-box {
    font-size: 28px;
    font-weight: bold;
    margin: 15px 0;
    transition: transform 0.3s;
  }
  input[type="number"] {
    font-size: 20px;
    padding: 8px;
    width: 100px;
    text-align: center;
    border-radius: 8px;
    border: 2px solid #ff6600;
  }
  button {
    font-size: 18px;
    padding: 8px 16px;
    margin: 10px 5px 10px 0;
    cursor: pointer;
    background-color: #ff9933;
    border: none;
    border-radius: 12px;
    color: white;
    transition: background 0.3s;
  }
  button:hover {
    background-color: #ff6600;
  }
  .message {
    font-size: 22px;
    min-height: 30px;
    margin-bottom: 10px;
  }
  .status {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .status div {
    background: #fff2e0;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .medallas {
    font-size: 24px;
    color: #f1c40f;
  }
  .progress-bar {
    margin: 15px auto;
    width: 90%;
    background-color: #ddd;
    border-radius: 10px;
    overflow: hidden;
    height: 20px;
  }
  .progress {
    height: 100%;
    width: 0;
    background-color: #ff6600;
    transition: width 0.5s;
  }
</style>
</head>
<body>

<div class="container">
  <h1>¡Multiplica y Gana!</h1>
  <div id="character">😃</div>

  <div class="tabla-select">
    <label><input type="checkbox" value="1"> 1</label>
    <label><input type="checkbox" value="2"> 2</label>
    <label><input type="checkbox" value="3"> 3</label>
    <label><input type="checkbox" value="4"> 4</label>
    <label><input type="checkbox" value="5"> 5</label>
    <label><input type="checkbox" value="6"> 6</label>
    <label><input type="checkbox" value="7"> 7</label>
    <label><input type="checkbox" value="8"> 8</label>
    <label><input type="checkbox" value="9"> 9</label>
    <label><input type="checkbox" value="10"> 10</label>
  </div>

  <button id="showTablesBtn">Ver Tablas Completas</button>
  <div id="tablesDisplay"></div>

  <div class="question-box" id="question">Selecciona al menos una tabla para comenzar</div>
  <input type="number" id="answer" placeholder="Tu respuesta">
  <button id="checkBtn">Comprobar</button>

  <div class="message" id="message"></div>

  <div class="status">
    <div>Aciertos: <span id="correct">0</span></div>
    <div>Errores: <span id="wrong">0</span></div>
    <div>Puntos: <span id="score">0</span></div>
    <div>Nivel: <span id="level">1</span></div>
    <div>Medallas: <span id="medals" class="medallas">🏅</span></div>
  </div>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>
</div>

<audio id="successSound">
  <source src="https://www.soundjay.com/button/sounds/button-3.mp3" type="audio/mpeg">
</audio>
<audio id="failSound">
  <source src="https://www.soundjay.com/button/sounds/button-10.mp3" type="audio/mpeg">
</audio>
<audio id="levelUpSound">
  <source src="https://www.soundjay.com/misc/sounds/bell-ringing-01.mp3" type="audio/mpeg">
</audio>

<script>
let selectedTables = [];
let currentQuestion = {};
let correctCount = 0;
let wrongCount = 0;
let score = 0;
let level = 1;
let medals = 1;

const checkBtn = document.getElementById('checkBtn');
const answerInput = document.getElementById('answer');
const questionBox = document.getElementById('question');
const messageBox = document.getElementById('message');
const correctDisplay = document.getElementById('correct');
const wrongDisplay = document.getElementById('wrong');
const scoreDisplay = document.getElementById('score');
const levelDisplay = document.getElementById('level');
const medalsDisplay = document.getElementById('medals');
const progressBar = document.getElementById('progress');
const character = document.getElementById('character');
const tablesDisplay = document.getElementById('tablesDisplay');

const successSound = document.getElementById('successSound');
const failSound = document.getElementById('failSound');
const levelUpSound = document.getElementById('levelUpSound');

const checkboxes = document.querySelectorAll('.tabla-select input[type="checkbox"]');
checkboxes.forEach(cb => {
  cb.addEventListener('change', () => {
    selectedTables = Array.from(checkboxes).filter(c => c.checked).map(c => parseInt(c.value));
    if(selectedTables.length > 0){
      nextQuestion();
    } else {
      questionBox.textContent = "Selecciona al menos una tabla para comenzar";
    }
  });
});

// Mostrar tablas completas como tablas visuales
document.getElementById('showTablesBtn').addEventListener('click', () => {
  if(tablesDisplay.style.display === 'none'){
    tablesDisplay.style.display = 'block';
    tablesDisplay.innerHTML = '';
    for(let t=1; t<=10; t++){
      let tabla = document.createElement('table');
      tabla.classList.add('tabla');
      let thead = document.createElement('thead');
      let trHead = document.createElement('tr');
      trHead.innerHTML = `<th colspan="2">Tabla del ${t}</th>`;
      thead.appendChild(trHead);
      tabla.appendChild(thead);
      let tbody = document.createElement('tbody');
      for(let i=1;i<=10;i++){
        let tr = document.createElement('tr');
        tr.innerHTML = `<td>${t} × ${i}</td><td>${t*i}</td>`;
        tbody.appendChild(tr);
      }
      tabla.appendChild(tbody);
      tablesDisplay.appendChild(tabla);
    }
  } else {
    tablesDisplay.style.display = 'none';
  }
});

function nextQuestion() {
  const table = selectedTables[Math.floor(Math.random() * selectedTables.length)];
  const multiplier = Math.floor(Math.random() * 10) + 1;
  currentQuestion = { table, multiplier };
  questionBox.textContent = `¿Cuánto es ${table} × ${multiplier}?`;
  answerInput.value = '';
  answerInput.focus();
  messageBox.textContent = '';
  questionBox.style.transform = 'scale(1)';
  character.textContent = '😃';
}

function updateProgress() {
  const progressPercent = Math.min((score % 50) * 2, 100);
  progressBar.style.width = progressPercent + '%';
  const newLevel = Math.floor(score / 50) + 1;
  if(newLevel > level){
    levelUpSound.play();
    medals = newLevel;
    medalsDisplay.textContent = '🏅'.repeat(medals);
  }
  level = newLevel;
  levelDisplay.textContent = level;
}

checkBtn.addEventListener('click', () => {
  const answer = parseInt(answerInput.value);
  if(isNaN(answer)){
    messageBox.textContent = "Por favor, ingresa un número";
    messageBox.style.color = "orange";
    return;
  }
  if(answer === currentQuestion.table * currentQuestion.multiplier){
    messageBox.textContent = "¡Correcto!";
    messageBox.style.color = "green";
    correctCount++;
    score += 10;
    successSound.play();
    character.textContent = '😎';
    questionBox.style.transform = 'scale(1.2)';
  } else {
    messageBox.textContent = `Incorrecto, la respuesta correcta es ${currentQuestion.table * currentQuestion.multiplier}`;
    messageBox.style.color = "red";
    wrongCount++;
    score = Math.max(0, score - 5);
    failSound.play();
    character.textContent = '😢';
  }
  correctDisplay.textContent = correctCount;
  wrongDisplay.textContent = wrongCount;
  scoreDisplay.textContent = score;
  updateProgress();
  setTimeout(nextQuestion, 500);
});
</script>

</body>
</html>
