<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juego de Tablas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{ background:#f4f6f9; }

.game-card{ max-width:700px; margin:auto; margin-top:40px; }

.result-icon{
  font-size:5rem;
  height:80px;
  opacity:0;
  transition:0.3s;
  font-weight:bold;
}

.result-icon.show{
  opacity:1;
  transform:scale(1.2);
}

.correct-icon{ color:#28a745 !important; }
.wrong-icon{ color:#dc3545 !important; }

.question{ font-size:2rem; font-weight:bold; }

.medal{ font-size:1.8rem; margin-right:5px; }

.timer{ font-size:1.2rem; font-weight:bold; }

.progress{ height:20px; }

.btn-primary{
  transition: transform 0.15s ease;
}
</style>
</head>

<body>

<div class="container">
<div class="card game-card shadow p-4">

<h3 class="text-center mb-3">🎮 Juego de Tablas</h3>

<div class="row mb-3">
<div class="col-md-6">
<label class="fw-bold">Temporizador:</label>
<select id="timeSelect" class="form-select">
<option value="0">Sin temporizador</option>
<option value="5">5 segundos</option>
<option value="10">10 segundos</option>
<option value="15">15 segundos</option>
</select>
</div>

<div class="col-md-6 d-flex align-items-end">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="examMode">
<label class="form-check-label fw-bold">Modo examen (10 preguntas)</label>
</div>
</div>
</div>

<label class="fw-bold">Selecciona tablas:</label>
<div class="d-flex flex-wrap gap-2 mb-3">
<script>
for(let i=1;i<=10;i++){
document.write(`
<div class="form-check">
<input class="form-check-input tableCheck" type="checkbox" value="${i}">
<label class="form-check-label">${i}</label>
</div>`);
}
</script>
</div>

<div class="text-center">
<div id="resultIcon" class="result-icon"></div>
</div>

<div class="text-center mb-2 timer" id="timer"></div>

<div class="text-center mb-3">
<div class="question" id="question">Selecciona tablas</div>
</div>

<div class="input-group mb-3">
<input type="number" id="answer" class="form-control">
<button class="btn btn-primary" id="checkBtn">Responder</button>
</div>

<div class="d-flex justify-content-between mb-2">
<div>Aciertos: <span id="correct">0</span></div>
<div>Errores: <span id="wrong">0</span></div>
<div>Nivel: <span id="level">1</span></div>
</div>

<div class="progress mb-3">
<div id="progressBar" class="progress-bar bg-success" style="width:0%"></div>
</div>

<div class="text-center mb-3" id="medals"></div>

<div class="text-center">
<button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#tablesModal">
📘 Ver tablas completas
</button>
</div>

</div>
</div>

<!-- MODAL TABLAS -->
<div class="modal fade" id="tablesModal">
<div class="modal-dialog modal-xl modal-dialog-scrollable">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">Tablas de Multiplicar</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<div class="row" id="tablesContainer"></div>
</div>
</div>
</div>
</div>

<audio id="successSound">
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_4010c3e5a4.mp3">
</audio>

<audio id="failSound">
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_8b9c2d9f04.mp3">
</audio>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
let selectedTables=[];
let currentQuestion={};
let correct=0;
let wrong=0;
let level=1;
let examCount=0;
let timerInterval=null;
let timeLeft=0;
let answering=false;

const resultIcon=document.getElementById("resultIcon");
const progressBar=document.getElementById("progressBar");
const answerInput=document.getElementById("answer");
const questionEl=document.getElementById("question");
const checkBtn=document.getElementById("checkBtn");

document.querySelectorAll(".tableCheck").forEach(cb=>{
cb.addEventListener("change",()=>{
selectedTables=[...document.querySelectorAll(".tableCheck")]
.filter(c=>c.checked).map(c=>parseInt(c.value));
if(selectedTables.length>0) nextQuestion();
});
});

function updateProgress(){
let progress=(correct%5)/5*100;
progressBar.style.width=progress+"%";
}

function startTimer(){
clearInterval(timerInterval);
let selectedTime=parseInt(document.getElementById("timeSelect").value);
if(selectedTime>0){
timeLeft=selectedTime;
document.getElementById("timer").textContent="⏳ "+timeLeft+"s";
timerInterval=setInterval(()=>{
timeLeft--;
document.getElementById("timer").textContent="⏳ "+timeLeft+"s";
if(timeLeft<=0){
clearInterval(timerInterval);
handleAnswer(null);
}
},1000);
}else{
document.getElementById("timer").textContent="";
}
}

function nextQuestion(){
if(document.getElementById("examMode").checked && examCount>=10){
finishExam();
return;
}
answering=false;
const table=selectedTables[Math.floor(Math.random()*selectedTables.length)];
const multiplier=Math.floor(Math.random()*10)+1;
currentQuestion={table,multiplier};
questionEl.textContent=`¿${table} × ${multiplier}?`;
answerInput.value="";
answerInput.focus();
startTimer();
}

function showIcon(type){
resultIcon.className="result-icon show "+(type==="correct"?"correct-icon":"wrong-icon");
resultIcon.textContent=(type==="correct")?"✔":"✖";
setTimeout(()=>{
resultIcon.className="result-icon";
resultIcon.textContent="";
},900);
}

function levelUp(){
level++;
document.getElementById("level").textContent=level;
document.getElementById("medals").innerHTML+="<span class='medal'>🏅</span>";
launchConfetti();
}

function launchConfetti(){
let duration=2500;
let end=Date.now()+duration;
(function frame(){
confetti({
particleCount:8,
spread:80,
origin:{y:0.6}
});
if(Date.now()<end){
requestAnimationFrame(frame);
}
})();
}

function handleAnswer(userAnswer){
if(answering) return;
answering=true;

clearInterval(timerInterval);

const correctResult=currentQuestion.table*currentQuestion.multiplier;
let waitTime=1000;

if(userAnswer===correctResult){
correct++;
document.getElementById("correct").textContent=correct;
document.getElementById("successSound").play();
showIcon("correct");
updateProgress();

if(correct%5===0){
progressBar.style.width="100%";
setTimeout(()=>{progressBar.style.width="0%";},500);
levelUp();
}

}else{
wrong++;
document.getElementById("wrong").textContent=wrong;
document.getElementById("failSound").play();
showIcon("wrong");

questionEl.innerHTML=`❌ Incorrecto<br><span style="font-size:1.5rem">La respuesta correcta es ${correctResult}</span>`;
waitTime=4000;
}

if(document.getElementById("examMode").checked){
examCount++;
}

setTimeout(nextQuestion,waitTime);
}

function validateInput(){
if(!currentQuestion.table) return;
let value=answerInput.value.trim();
if(value==="") return;
let number=parseInt(value);
if(isNaN(number)) return;

checkBtn.style.transform="scale(0.9)";
setTimeout(()=>{checkBtn.style.transform="scale(1)";},150);

handleAnswer(number);
}

checkBtn.addEventListener("click",validateInput);

answerInput.addEventListener("keydown",function(e){
if(e.key==="Enter"){
e.preventDefault();
validateInput();
}
});

answerInput.addEventListener("input",function(){
this.value=this.value.replace(/[^0-9]/g,"");
});

function finishExam(){
let score=Math.round((correct/10)*10);
alert("Examen terminado\nNota: "+score+"/10");
examCount=0;
correct=0;
wrong=0;
level=1;
document.getElementById("correct").textContent=0;
document.getElementById("wrong").textContent=0;
document.getElementById("level").textContent=1;
progressBar.style.width="0%";
}

const container=document.getElementById("tablesContainer");
for(let i=1;i<=10;i++){
let html=`<div class="col-md-4 mb-3">
<div class="card p-2">
<h6 class="text-center">Tabla del ${i}</h6>
<table class="table table-sm">`;
for(let j=1;j<=10;j++){
html+=`<tr><td>${i} × ${j}</td><td>=</td><td>${i*j}</td></tr>`;
}
html+="</table></div></div>";
container.innerHTML+=html;
}
</script>

</body>
</html>
