<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Tablas Pro</title>

<!-- 🔥 IMPORTANTE PARA MÓVIL -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
background:#f2f4f8;
}

.card{
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

#question{
font-weight:bold;
}

@media (min-width:768px){
#question{
font-size:2.5rem;
}
}

@media (max-width:767px){
#question{
font-size:2rem;
}
}

.result-icon{
position:absolute;
top:-30px;
left:50%;
transform:translateX(-50%);
font-size:4rem;
opacity:0;
transition:0.4s;
z-index:10;
}

.result-icon.show{
opacity:1;
top:-60px;
}

.correct-icon{
color:#28a745 !important;
}

.wrong-icon{
color:#dc3545 !important;
}

.medal{
font-size:1.5rem;
margin:2px;
}

.progress{
height:20px;
border-radius:10px;
}

/* Botones grandes para niños */
.btn{
padding:12px;
font-size:1.2rem;
border-radius:12px;
}

/* Input grande y cómodo */
#answer{
font-size:1.5rem;
height:55px;
text-align:center;
}
</style>
</head>

<body>

<div class="container py-3">
<div class="card p-3 p-md-4 position-relative">

<h2 class="text-center mb-3">🎮 Juego de Tablas</h2>

<div class="text-center mb-3">
Nivel: <strong id="level">1</strong>
<div id="medals"></div>
</div>

<div class="progress mb-3">
<div id="progressBar" class="progress-bar bg-success" style="width:0%"></div>
</div>

<div class="row g-2 mb-3">
<div class="col-6">
<select id="timeSelect" class="form-select">
<option value="0">Sin tiempo</option>
<option value="5">5 seg</option>
<option value="10">10 seg</option>
<option value="15">15 seg</option>
</select>
</div>

<div class="col-6 d-flex align-items-center">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="examMode">
<label class="form-check-label">Modo examen</label>
</div>
</div>
</div>

<div class="mb-3 text-center">
<label class="mb-2 d-block">Selecciona tablas</label>
<div id="tablesContainer" class="d-flex flex-wrap justify-content-center gap-2"></div>
</div>

<div class="text-center position-relative mb-3">
<div id="resultIcon" class="result-icon"></div>
<div id="question">Selecciona una tabla</div>
<div id="timer" class="mt-2 fw-bold text-warning"></div>
</div>

<div class="input-group mb-3">
<input 
type="number" 
id="answer" 
class="form-control"
placeholder="Respuesta"
inputmode="numeric"
pattern="[0-9]*"
autocomplete="off"
>
<button id="checkBtn" class="btn btn-primary">Comprobar</button>
</div>

<div class="text-center fs-5">
<span class="text-success">✔️ <span id="correct">0</span></span>
|
<span class="text-danger">❌ <span id="wrong">0</span></span>
</div>

</div>
</div>

<script>
let selectedTables=[];
let currentQuestion={};
let correct=0;
let wrong=0;
let level=1;
let examCount=0;
let timerInterval=null;
let answering=false;

const resultIcon=document.getElementById("resultIcon");
const progressBar=document.getElementById("progressBar");
const answerInput=document.getElementById("answer");
const questionEl=document.getElementById("question");
const checkBtn=document.getElementById("checkBtn");

/* Crear tablas */
for(let i=1;i<=10;i++){
document.getElementById("tablesContainer").innerHTML+=
`<button class="btn btn-outline-primary tableBtn" data-value="${i}">${i}</button>`;
}

document.querySelectorAll(".tableBtn").forEach(btn=>{
btn.addEventListener("click",()=>{
btn.classList.toggle("btn-primary");
btn.classList.toggle("btn-outline-primary");

selectedTables=[...document.querySelectorAll(".tableBtn.btn-primary")]
.map(b=>parseInt(b.dataset.value));

if(selectedTables.length>0) nextQuestion();
});
});

function updateProgress(){
let progress=(correct%5)/5*100;
progressBar.style.width=progress+"%";
}

function startTimer(){
clearInterval(timerInterval);
let selectedTime=parseInt(document.getElementById("timeSelect").value);
if(selectedTime>0){
let timeLeft=selectedTime;
document.getElementById("timer").textContent="⏳ "+timeLeft+"s";
timerInterval=setInterval(()=>{
timeLeft--;
document.getElementById("timer").textContent="⏳ "+timeLeft+"s";
if(timeLeft<=0){
clearInterval(timerInterval);
handleAnswer(null);
}
},1000);
}else{
document.getElementById("timer").textContent="";
}
}

function nextQuestion(){
if(document.getElementById("examMode").checked && examCount>=10){
finishExam();
return;
}
answering=false;

const table=selectedTables[Math.floor(Math.random()*selectedTables.length)];
const multiplier=Math.floor(Math.random()*10)+1;

currentQuestion={table,multiplier};
questionEl.textContent=`¿${table} × ${multiplier}?`;
answerInput.value="";
answerInput.focus();
startTimer();
}

function showIcon(type){
resultIcon.className="result-icon show";
if(type==="correct"){
resultIcon.classList.add("correct-icon");
resultIcon.textContent="✔";
}else{
resultIcon.classList.add("wrong-icon");
resultIcon.textContent="✖";
}
setTimeout(()=>{
resultIcon.className="result-icon";
resultIcon.textContent="";
},1000);
}

function levelUp(){
level++;
document.getElementById("level").textContent=level;
document.getElementById("medals").innerHTML+="<span class='medal'>🏅</span>";
launchConfetti();
}

function launchConfetti(){
let duration=3000;
let end=Date.now()+duration;
(function frame(){
confetti({particleCount:8,spread:70,origin:{y:0.6}});
if(Date.now()<end){requestAnimationFrame(frame);}
})();
}

function handleAnswer(userAnswer){
if(answering) return;
answering=true;
clearInterval(timerInterval);

const correctResult=currentQuestion.table*currentQuestion.multiplier;
let waitTime=1000;

if(userAnswer===correctResult){
correct++;
document.getElementById("correct").textContent=correct;
showIcon("correct");
updateProgress();

if(correct%5===0){
progressBar.style.width="100%";
setTimeout(()=>{progressBar.style.width="0%";},500);
levelUp();
}

}else{
wrong++;
document.getElementById("wrong").textContent=wrong;
showIcon("wrong");
questionEl.innerHTML=`❌ Incorrecto<br><span class="fs-4">La respuesta correcta es ${correctResult}</span>`;
waitTime=4000;
}

if(document.getElementById("examMode").checked){
examCount++;
}

setTimeout(nextQuestion,waitTime);
}

checkBtn.addEventListener("click",validateInput);

answerInput.addEventListener("keydown",function(e){
if(e.key==="Enter"){
e.preventDefault();
validateInput();
}
});

function validateInput(){
if(!currentQuestion.table) return;
let value=answerInput.value.trim();
if(value==="") return;
let number=parseInt(value);
if(isNaN(number)) return;
checkBtn.style.transform="scale(0.9)";
setTimeout(()=>{checkBtn.style.transform="scale(1)";},150);
handleAnswer(number);
}

function finishExam(){
alert("Examen terminado\nAciertos: "+correct+"/10");
examCount=0;
correct=0;
wrong=0;
level=1;
document.getElementById("correct").textContent=0;
document.getElementById("wrong").textContent=0;
document.getElementById("level").textContent=1;
progressBar.style.width="0%";
}
</script>

</body>
</html>
